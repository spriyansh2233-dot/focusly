spring:
  application:
    name: focusly
  datasource:
    url: jdbc:h2:file:./data/ai_copilot_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: simple
gemini:
  api:
    key: AIzaSyBqb3YRqQcVmvKJPDVj9NRhmc9MGbj2IrE
